<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Premium Store</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="logo">
          <span class="logo-icon">🏹</span>
          <span class="logo-text">PREMIUM STORE</span>
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <a href="https://wa.me/15551234567" class="btn btn-whatsapp btn-block" target="_blank">
          Continue with WhatsApp
        </a>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="/register" class="link">Sign up</a>
      </p>
    </div>

    <div class="auth-side">
      <div class="auth-side-content">
        <h2>Join Our Global Community</h2>
        <ul class="auth-benefits">
          <li>✓ Exclusive product access</li>
          <li>✓ Early bird discounts</li>
          <li>✓ Order tracking</li>
          <li>✓ WhatsApp support priority</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          // Redirect based on role
          if (data.user.role === 'admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } else {
          alert(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed. Please try again.');
      }
    });
  </script>
</body>
</html>
